<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Justin Zuchowski</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">Justinz.me</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Resume</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Projects & Code</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-5 fw-bold text-dark">Get In Touch</h1>
            <p class="lead text-muted">Feel free to reach out for professional opportunities, consulting, or inquiries.</p>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm p-4">
                    <div class="card-body">
                        <div class="mb-4 text-center">
                            <p class="mb-1"><i class="bi bi-geo-alt-fill text-primary me-2"></i>Colorado Springs, CO</p>
                            <p class="mb-1"><i class="bi bi-envelope-fill text-primary me-2"></i>XXXXXXXXXXXXXXXXXXXXXXXXXX</p>
                            <p class="mb-0"><i class="bi bi-telephone-fill text-primary me-2"></i>XXXXXXXXXXXX</p>
                        </div>
                        <hr class="my-4">
                        <form id="contactForm">
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">Name</label>
                                <input type="text" class="form-control" id="name" placeholder="Your Name" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label fw-semibold">Message</label>
                                <textarea class="form-control" id="message" rows="4" placeholder="Your message..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0 small">&copy; <span id="year"></span> Justin Zuchowski. Hosted at <strong>Justinz.me</strong></p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
